server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_min_length 1000;
    gzip_types text/css application/javascript application/json image/svg+xml text/vtt;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        expires -1;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /media/ {
        try_files $uri =404;
    }

    location ~* \.vtt$ {
        types { }
        default_type text/vtt;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
